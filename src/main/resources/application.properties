spring.application.name=pastisiap-backend
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pastisiap}
spring.datasource.username=${DB_USERNAME:pastisiap}
spring.datasource.password=${DB_PASSWORD:pastisiap}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
info.app.name=PastiSiap Backend
info.app.description=Modular monolith API and worker for PastiSiap

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

pastisiap.storage.root=${STORAGE_ROOT:./storage}
pastisiap.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:20971520}
pastisiap.worker.enabled=${WORKER_ENABLED:false}
pastisiap.worker.poll-interval=${WORKER_POLL_INTERVAL:PT2S}
pastisiap.worker.max-attempts=${WORKER_MAX_ATTEMPTS:5}
