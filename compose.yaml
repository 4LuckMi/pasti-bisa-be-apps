services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pastisiap}
      POSTGRES_USER: ${DB_USERNAME:-pastisiap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pastisiap}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pastisiap} -d ${DB_NAME:-pastisiap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: pasti-bisa-backend-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pastisiap}
      DB_USERNAME: ${DB_USERNAME:-pastisiap}
      DB_PASSWORD: ${DB_PASSWORD:-pastisiap}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-/}
      STORAGE_ROOT: /app/storage
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage

  demo-accounts:
    profiles: ["demo-tools"]
    image: pasti-bisa-backend-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo-accounts
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pastisiap}
      DB_USERNAME: ${DB_USERNAME:-pastisiap}
      DB_PASSWORD: ${DB_PASSWORD:-pastisiap}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
      WORKER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xmx384m
    mem_limit: 768m

  worker:
    image: pasti-bisa-backend-api
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pastisiap}
      DB_USERNAME: ${DB_USERNAME:-pastisiap}
      DB_PASSWORD: ${DB_PASSWORD:-pastisiap}
      STORAGE_ROOT: /app/storage
      WORKER_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -Xmx512m
    mem_limit: 768m
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
